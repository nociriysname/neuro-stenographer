# Конфигурация detekt перенесена из CuApp (detekt/config/detekt.yml), buildUponDefaultConfig = true.
config:
    validation: false
    warningsAsErrors: false
    checkExhaustiveness: false

processors:
    active: true
    exclude:
        - 'DetektProgressListener'

console-reports:
    active: true
    exclude:
        - 'ProjectStatisticsReport'
        - 'ComplexityReport'
        - 'NotificationReport'
        - 'IssuesReport'
        - 'FileBasedIssuesReport'

comments:
    active: true
    AbsentOrWrongFileLicense:
        active: false
        licenseTemplateIsRegex: false
        licenseTemplate: ''
    DeprecatedBlockTag:
        active: false
    DocumentationOverPrivateFunction:
        active: false
    DocumentationOverPrivateProperty:
        active: false
    EndOfSentenceFormat:
        active: false
        endOfSentenceFormat: '([.?!][ \t\n\r\f<])|([.?!:]$)'
    KDocReferencesNonPublicProperty:
        active: false
        excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**']
    OutdatedDocumentation:
        active: false
        matchTypeParameters: true
        matchDeclarationsOrder: true
        allowParamOnConstructorProperties: false
    UndocumentedPublicClass:
        active: false
        excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**']
        searchInNestedClass: true
        searchInInnerClass: true
        searchInInnerObject: true
        searchInInnerInterface: true
        searchInProtectedClass: false
        ignoreDefaultCompanionObject: false
    UndocumentedPublicFunction:
        active: false
        excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**']
        searchProtectedFunction: false
    UndocumentedPublicProperty:
        active: false
        excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**']
        searchProtectedProperty: false
        ignoreEnumEntries: false

complexity:
    active: true
    CognitiveComplexMethod:
        active: false
        allowedComplexity: 15
    ComplexCondition:
        active: true
        allowedConditions: 3
    ComplexInterface:
        active: false
        allowedDefinitions: 10
        includeStaticDeclarations: false
        includePrivateDeclarations: false
        ignoreOverloaded: false
    CyclomaticComplexMethod:
        active: true
        threshold: 20
        ignoreAnnotated: ['Composable']
        ignoreSingleWhenExpression: false
        ignoreSimpleWhenEntries: false
        ignoreNestingFunctions: false
        ignoreLocalFunctions: false
        nestingFunctions:
            - 'also'
            - 'apply'
            - 'forEach'
            - 'isNotNull'
            - 'ifNull'
            - 'let'
            - 'run'
            - 'use'
            - 'with'
    LabeledExpression:
        active: false
        ignoredLabels: []
    LargeClass:
        active: true
        allowedLines: 600
    LongMethod:
        active: true
        threshold: 100
        ignoreAnnotated: ['Composable', 'Preview']
    LongParameterList:
        active: true
        functionThreshold: 10
        constructorThreshold: 12
        ignoreDefaultParameters: true
        ignoreDataClasses: true
        ignoreAnnotatedParameter: []
    MethodOverloading:
        active: false
        allowedOverloads: 6
    NamedArguments:
        active: false
        allowedArguments: 3
        ignoreMethods: []
        ignoreArgumentsMatchingNames: false
    NestedBlockDepth:
        active: true
        allowedDepth: 4
    NestedScopeFunctions:
        active: false
        allowedDepth: 1
        functions:
            - 'kotlin.apply'
            - 'kotlin.run'
            - 'kotlin.with'
            - 'kotlin.let'
            - 'kotlin.also'
    ReplaceSafeCallChainWithRun:
        active: false
    StringLiteralDuplication:
        active: false
        excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**']
        allowedDuplications: 2
        ignoreAnnotation: true
        allowedWithLengthLessThan: 5
        ignoreStringsRegex: '$^'
    TooManyFunctions:
        active: true
        excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**', '**/*Component.kt', '**/*Module.kt']
        thresholdInFiles: 15
        thresholdInClasses: 30
        thresholdInInterfaces: 11
        thresholdInObjects: 11
        thresholdInEnums: 11
        ignoreDeprecated: false
        ignorePrivate: false
        ignoreInternal: false
        ignoreOverridden: false
        ignoreAnnotatedFunctions: ['Preview', 'Composable']

coroutines:
    active: true
    CoroutineLaunchedInTestWithoutRunTest:
        active: false
    GlobalCoroutineUsage:
        active: false
    InjectDispatcher:
        active: true
        dispatcherNames:
            - 'IO'
            - 'Default'
            - 'Unconfined'
    RedundantSuspendModifier:
        active: true
    SleepInsteadOfDelay:
        active: true
    SuspendFunInFinallySection:
        active: false
    SuspendFunSwallowedCancellation:
        active: false
    SuspendFunWithCoroutineScopeReceiver:
        active: false
    SuspendFunWithFlowReturnType:
        active: true

empty-blocks:
    active: true
    EmptyCatchBlock:
        active: true
        allowedExceptionNameRegex: '(ignore|expected).*'
    EmptyClassBlock:
        active: true
    EmptyDefaultConstructor:
        active: true
    EmptyDoWhileBlock:
        active: true
    EmptyElseBlock:
        active: true
    EmptyFinallyBlock:
        active: true
    EmptyForBlock:
        active: true
    EmptyFunctionBlock:
        active: true
        ignoreOverridden: false
    EmptyIfBlock:
        active: true
    EmptyInitBlock:
        active: true
    EmptyKotlinFile:
        active: true
    EmptySecondaryConstructor:
        active: true
    EmptyTryBlock:
        active: true
    EmptyWhenBlock:
        active: true
    EmptyWhileBlock:
        active: true

exceptions:
    active: true
    ErrorUsageWithThrowable:
        active: false
    ExceptionRaisedInUnexpectedLocation:
        active: true
        methodNames:
            - 'equals'
            - 'finalize'
            - 'hashCode'
            - 'toString'
    InstanceOfCheckForException:
        active: true
        excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**']
    NotImplementedDeclaration:
        active: false
    ObjectExtendsThrowable:
        active: false
    PrintStackTrace:
        active: true
    RethrowCaughtException:
        active: true
    ReturnFromFinally:
        active: true
        ignoreLabeled: false
    SwallowedException:
        active: true
        excludes: ['**/*StoreFactory.kt', '**/*Bootstrapper.kt', '**/*Executor.kt', '**/*RepositoryImpl.kt', '**/*CryptoManager.kt', '**/*SmsCodeProvider.kt']
        ignoredExceptionTypes:
            - 'InterruptedException'
            - 'MalformedURLException'
            - 'NumberFormatException'
            - 'ParseException'
        allowedExceptionNameRegex: '(ignore|expected).*'
    ThrowingExceptionFromFinally:
        active: true
    ThrowingExceptionInMain:
        active: false
    ThrowingExceptionsWithoutMessageOrCause:
        active: true
        excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**']
        exceptions:
            - 'ArrayIndexOutOfBoundsException'
            - 'Exception'
            - 'IllegalArgumentException'
            - 'IllegalMonitorStateException'
            - 'IllegalStateException'
            - 'IndexOutOfBoundsException'
            - 'NullPointerException'
            - 'RuntimeException'
            - 'Throwable'
    ThrowingNewInstanceOfSameException:
        active: true
    TooGenericExceptionCaught:
        active: false
        excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**']
        exceptionNames:
            - 'ArrayIndexOutOfBoundsException'
            - 'Error'
            - 'Exception'
            - 'IllegalMonitorStateException'
            - 'IndexOutOfBoundsException'
            - 'NullPointerException'
            - 'RuntimeException'
            - 'Throwable'
        allowedExceptionNameRegex: '(ignore|expected).*'
    TooGenericExceptionThrown:
        active: true
        excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**']
        exceptionNames:
            - 'Error'
            - 'Exception'
            - 'RuntimeException'
            - 'Throwable'

naming:
    active: true
    BooleanPropertyNaming:
        active: false
        allowedPattern: '^(is|has|are)'
    ClassNaming:
        active: true
        classPattern: '[A-Z][a-zA-Z0-9]*'
    ConstructorParameterNaming:
        active: true
        parameterPattern: '[a-z][A-Za-z0-9]*'
        privateParameterPattern: '[a-z][A-Za-z0-9]*'
        excludeClassPattern: '$^'
    EnumNaming:
        active: true
        enumEntryPattern: '[A-Z][_a-zA-Z0-9]*'
    ForbiddenClassName:
        active: false
        forbiddenName: []
    FunctionNameMaxLength:
        active: false
        maximumFunctionNameLength: 30
    FunctionNameMinLength:
        active: false
        minimumFunctionNameLength: 3
    FunctionNaming:
        active: true
        excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**', '**/MainViewController.kt', '**/DemoMainViewController.kt']
        functionPattern: '[a-z][a-zA-Z0-9]*'
        excludeClassPattern: '$^'
        ignoreAnnotated: ['Composable']
    FunctionParameterNaming:
        active: true
        parameterPattern: '[a-z][A-Za-z0-9]*'
        excludeClassPattern: '$^'
    InvalidPackageDeclaration:
        active: true
        rootPackage: ''
        requireRootInDeclaration: false
    LambdaParameterNaming:
        active: false
        parameterPattern: '[a-z][A-Za-z0-9]*|_'
    MatchingDeclarationName:
        active: true
        excludes: ['**/Platform.android.kt', '**/Platform.ios.kt', '**/*.android.kt', '**/*.ios.kt']
        mustBeFirst: true
        multiplatformTargets:
            - 'ios'
            - 'android'
            - 'js'
            - 'jvm'
            - 'native'
            - 'iosArm64'
            - 'iosX64'
            - 'macosX64'
            - 'mingwX64'
            - 'linuxX64'
    MemberNameEqualsClassName:
        active: true
        ignoreOverridden: true
    NoNameShadowing:
        active: true
    NonBooleanPropertyPrefixedWithIs:
        active: false
    ObjectPropertyNaming:
        active: true
        constantPattern: '[A-Z][_A-Z0-9]*'
        propertyPattern: '[A-Za-z][_A-Za-z0-9]*'
        privatePropertyPattern: '(_)?[A-Za-z][_A-Za-z0-9]*'
    PackageNaming:
        active: true
        packagePattern: '[a-z]+(\.[a-z][A-Za-z0-9]*)*'
    TopLevelPropertyNaming:
        active: true
        constantPattern: '[A-Z][_A-Z0-9]*'
        propertyPattern: '[A-Za-z][_A-Za-z0-9]*'
        privatePropertyPattern: '_?[A-Za-z][_A-Za-z0-9]*'
    VariableMaxLength:
        active: false
        maximumVariableNameLength: 64
    VariableMinLength:
        active: false
        minimumVariableNameLength: 1
    VariableNaming:
        active: true
        variablePattern: '[a-z][A-Za-z0-9]*'
        privateVariablePattern: '(_)?[a-z][A-Za-z0-9]*'
        excludeClassPattern: '$^'

performance:
    active: true
    ArrayPrimitive:
        active: true
    CouldBeSequence:
        active: false
        allowedOperations: 2
    ForEachOnRange:
        active: true
        excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**']
    SpreadOperator:
        active: true
        excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**']
    UnnecessaryInitOnArray:
        active: false
    UnnecessaryPartOfBinaryExpression:
        active: false
    UnnecessaryTemporaryInstantiation:
        active: true
    UnnecessaryTypeCasting:
        active: false

potential-bugs:
    active: true
    AvoidReferentialEquality:
        active: true
        forbiddenTypePatterns:
            - 'kotlin.String'
    CastNullableToNonNullableType:
        active: false
        ignorePlatformTypes: true
    CastToNullableType:
        active: false
    CharArrayToStringCall:
        active: false
    Deprecation:
        active: false
        excludeImportStatements: false
    DontDowncastCollectionTypes:
        active: false
    DoubleMutabilityForCollection:
        active: true
        mutableTypes:
            - 'kotlin.collections.MutableList'
            - 'kotlin.collections.MutableMap'
            - 'kotlin.collections.MutableSet'
            - 'java.util.ArrayList'
            - 'java.util.LinkedHashSet'
            - 'java.util.HashSet'
            - 'java.util.LinkedHashMap'
            - 'java.util.HashMap'
    ElseCaseInsteadOfExhaustiveWhen:
        active: false
        ignoredSubjectTypes: []
    EqualsAlwaysReturnsTrueOrFalse:
        active: true
    EqualsWithHashCodeExist:
        active: true
    ExitOutsideMain:
        active: false
    ExplicitGarbageCollectionCall:
        active: true
    HasPlatformType:
        active: true
    IgnoredReturnValue:
