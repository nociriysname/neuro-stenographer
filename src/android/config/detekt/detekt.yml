        ignoreFunctionCall: []
    ImplicitDefaultLocale:
        active: true
    ImplicitUnitReturnType:
        active: false
        allowExplicitReturnType: true
    InvalidRange:
        active: true
    IteratorHasNextCallsNextMethod:
        active: true
    IteratorNotThrowingNoSuchElementException:
        active: true
    LateinitUsage:
        active: false
        excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**']
        ignoreOnClassesPattern: ''
    MapGetWithNotNullAssertionOperator:
        active: true
    MissingPackageDeclaration:
        active: false
        excludes: ['**/*.kts']
    MissingSuperCall:
        active: false
        mustInvokeSuperAnnotations:
            - 'androidx.annotation.CallSuper'
            - 'javax.annotation.OverridingMethodsMustInvokeSuper'
    MissingUseCall:
        active: false
    NullCheckOnMutableProperty:
        active: false
    NullableToStringCall:
        active: false
    PropertyUsedBeforeDeclaration:
        active: false
    UnconditionalJumpStatementInLoop:
        active: false
    UnnamedParameterUse:
        active: false
        allowAdjacentDifferentTypeParams: true
        allowSingleParamUse: true
        ignoreArgumentsMatchingNames: true
        ignoreFunctionCall: []
    UnnecessaryNotNullCheck:
        active: false
    UnnecessaryNotNullOperator:
        active: true
    UnnecessarySafeCall:
        active: true
    UnreachableCatchBlock:
        active: true
    UnreachableCode:
        active: true
    UnsafeCallOnNullableType:
        active: true
        excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**']
    UnsafeCast:
        active: true
    UnusedUnaryOperator:
        active: true
    UselessPostfixExpression:
        active: true
    WrongEqualsTypeParameter:
        active: true

formatting:
    active: true
    ImportOrdering:
        active: true
        excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/iosTest/**']

style:
    active: true
    AbstractClassCanBeConcreteClass:
        active: true
    AbstractClassCanBeInterface:
        active: true
    AlsoCouldBeApply:
        active: false
    BracesOnIfStatements:
        active: false
        singleLine: 'never'
        multiLine: 'always'
    BracesOnWhenStatements:
        active: false
        singleLine: 'necessary'
        multiLine: 'consistent'
    CanBeNonNullable:
        active: false
    CascadingCallWrapping:
        active: false
        includeElvis: true
    ClassOrdering:
        active: false
    CollapsibleIfStatements:
        active: false
    DataClassContainsFunctions:
        active: false
        conversionFunctionPrefix:
            - 'to'
        allowOperators: false
    DataClassShouldBeImmutable:
        active: false
    DestructuringDeclarationWithTooManyEntries:
        active: true
        maxDestructuringEntries: 3
    DoubleNegativeExpression:
        active: false
    DoubleNegativeLambda:
        active: false
        negativeFunctions:
            -   reason: 'Use `takeIf` instead.'
                value: 'takeUnless'
            -   reason: 'Use `all` instead.'
                value: 'none'
        negativeFunctionNameParts:
            - 'not'
            - 'non'
    EqualsNullCall:
        active: true
    EqualsOnSignatureLine:
        active: false
    ExplicitCollectionElementAccessMethod:
        active: false
    ExplicitItLambdaMultipleParameters:
        active: true
    ExplicitItLambdaParameter:
        active: true
    ExpressionBodySyntax:
        active: false
        includeLineWrapping: false
    ForbiddenAnnotation:
        active: false
        annotations:
            -   reason: 'it is a java annotation. Use `Suppress` instead.'
                value: 'java.lang.SuppressWarnings'
            -   reason: 'it is a java annotation. Use `kotlin.Deprecated` instead.'
                value: 'java.lang.Deprecated'
            -   reason: 'it is a java annotation. Use `kotlin.annotation.MustBeDocumented` instead.'
                value: 'java.lang.annotation.Documented'
            -   reason: 'it is a java annotation. Use `kotlin.annotation.Target` instead.'
                value: 'java.lang.annotation.Target'
            -   reason: 'it is a java annotation. Use `kotlin.annotation.Retention` instead.'
                value: 'java.lang.annotation.Retention'
            -   reason: 'it is a java annotation. Use `kotlin.annotation.Repeatable` instead.'
                value: 'java.lang.annotation.Repeatable'
            -   reason: 'Kotlin does not support @Inherited annotation, see https://youtrack.jetbrains.com/issue/KT-22265'
                value: 'java.lang.annotation.Inherited'
    ForbiddenComment:
        active: false
        comments:
            -   reason: 'Forbidden FIXME todo marker in comment, please fix the problem.'
                value: 'FIXME:'
            -   reason: 'Forbidden STOPSHIP todo marker in comment, please address the problem before shipping the code.'
                value: 'STOPSHIP:'
            -   reason: 'Forbidden TODO todo marker in comment, please do the changes.'
                value: 'TODO:'
        allowedPatterns: ''
    # Экраны собираются из компонентов common-uikit: Material 3 — только внутри дизайн-системы (ripple).
    ForbiddenImport:
        active: true
        excludes: ['**/common-uikit/**']
        imports:
            - value: 'androidx.compose.material3.*'
              reason: 'Используйте компоненты common-uikit (StenoButton, StenoCard, StenoTopBar и др.).'
    ForbiddenMethodCall:
        active: false
        methods:
            -   reason: 'print does not allow you to configure the output stream. Use a logger instead.'
                value: 'kotlin.io.print'
            -   reason: 'println does not allow you to configure the output stream. Use a logger instead.'
                value: 'kotlin.io.println'
            -   reason: 'using `BigDecimal(Double)` can result in unexpected floating point precision behavior. Use `BigDecimal.valueOf(Double)` or `String.toBigDecimalOrNull()` instead.'
                value: 'java.math.BigDecimal.<init>(kotlin.Double)'
            -   reason: 'using `BigDecimal(String)` can result in a `NumberFormatException`. Use `String.toBigDecimalOrNull()`'
                value: 'java.math.BigDecimal.<init>(kotlin.String)'
            -   reason: 'It is marked as obsolete. Use `kotlin.time.measureTime` instead.'
                value: 'kotlin.system.measureTimeMillis'
    ForbiddenNamedParam:
        active: false
        methods: []
    ForbiddenOptIn:
        active: false
        markerClasses: []
    ForbiddenSuppress:
        active: false
        rules: []
    ForbiddenVoid:
